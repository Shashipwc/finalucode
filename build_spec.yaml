# OCI DevOps — Export OIC3 project and upload .car to Object Storage
# No Vault — all values come from Pipeline → Parameters tab.
#
# Build spec path: build_spec_export.yaml
#
version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash
failImmediatelyOnError: true

env:
  variables:
    PARAM_PROJECT_ID: "${PARAM_PROJECT_ID}"
    PARAM_ARCHIVE_NAME: "${PARAM_ARCHIVE_NAME}"
    PARAM_PROJECT_LABEL: "${PARAM_PROJECT_LABEL}"
    PARAM_OS_OBJECT_NAME: "${PARAM_OS_OBJECT_NAME}"
    OS_BUCKET: "${OS_BUCKET}"
    OS_NAMESPACE: "${OS_NAMESPACE}"
    SRC_TOKEN_URL: "${SRC_TOKEN_URL}"
    SRC_CLIENT_ID: "${SRC_CLIENT_ID}"
    SRC_CLIENT_SECRET: "${SRC_CLIENT_SECRET}"
    SRC_SCOPE: "${SRC_SCOPE}"
    SRC_OIC_BASE_URL: "${SRC_OIC_BASE_URL}"
    SRC_OIC_INSTANCE: "${SRC_OIC_INSTANCE}"
  exportedVariables:
    - OS_OBJECT_NAME
    - ARCHIVE_PATH

steps:
  - type: Command
    name: Setup
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR:-.}"
      echo "=== OIC Export ==="
      if command -v jq >/dev/null 2>&1; then
        echo "jq: OK"
      elif command -v yum >/dev/null 2>&1; then
        yum install -y jq
      elif command -v apt-get >/dev/null 2>&1; then
        apt-get update -y && apt-get install -y jq
      fi
      command -v jq oci curl
      mkdir -p exports
      chmod +x scripts/*.sh
      export OCI_CLI_AUTH="${OCI_CLI_AUTH:-resource_principal}"
      export ARCHIVE_PATH="exports/${PARAM_ARCHIVE_NAME}"
      export OS_OBJECT_NAME="${PARAM_OS_OBJECT_NAME:-oic-exports/${PARAM_ARCHIVE_NAME}}"
      : "${SRC_TOKEN_URL:?Missing SRC_TOKEN_URL}"
      : "${SRC_CLIENT_ID:?Missing SRC_CLIENT_ID}"
      : "${SRC_CLIENT_SECRET:?Missing SRC_CLIENT_SECRET}"
      : "${SRC_SCOPE:?Missing SRC_SCOPE}"
      : "${SRC_OIC_BASE_URL:?Missing SRC_OIC_BASE_URL}"
      : "${SRC_OIC_INSTANCE:?Missing SRC_OIC_INSTANCE}"
      : "${OS_BUCKET:?Missing OS_BUCKET}"
      : "${PARAM_PROJECT_ID:?Missing PARAM_PROJECT_ID}"
      : "${PARAM_ARCHIVE_NAME:?Missing PARAM_ARCHIVE_NAME}"
      echo "Project:  ${PARAM_PROJECT_ID}"
      echo "Archive:  ${ARCHIVE_PATH}"
      echo "Bucket:   ${OS_BUCKET}"
      echo "Object:   ${OS_OBJECT_NAME}"

  - type: Command
    name: Export from source OIC
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR:-.}"
      export OCI_CLI_AUTH="${OCI_CLI_AUTH:-resource_principal}"
      export ARCHIVE_PATH="exports/${PARAM_ARCHIVE_NAME}"
      TOKEN="$(scripts/get_token.sh "${SRC_TOKEN_URL}" "${SRC_CLIENT_ID}" "${SRC_CLIENT_SECRET}" "${SRC_SCOPE}")"
      scripts/export_project.sh \
        "${SRC_OIC_BASE_URL}" \
        "${SRC_OIC_INSTANCE}" \
        "${TOKEN}" \
        "${PARAM_PROJECT_ID}" \
        "${PARAM_PROJECT_LABEL:-}" \
        "${ARCHIVE_PATH}"
      test -f "${ARCHIVE_PATH}"
      ls -la "${ARCHIVE_PATH}"

  - type: Command
    name: Upload to Object Storage
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR:-.}"
      export OCI_CLI_AUTH="${OCI_CLI_AUTH:-resource_principal}"
      export ARCHIVE_PATH="exports/${PARAM_ARCHIVE_NAME}"
      export OS_OBJECT_NAME="${PARAM_OS_OBJECT_NAME:-oic-exports/${PARAM_ARCHIVE_NAME}}"
      scripts/oss_object_put.sh "${ARCHIVE_PATH}" "${OS_BUCKET}" "${OS_OBJECT_NAME}"
      echo "Export complete. Object key: ${OS_OBJECT_NAME}"
