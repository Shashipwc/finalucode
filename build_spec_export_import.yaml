version: 0.1
component: build
timeoutInSeconds: 7200
shell: bash
failImmediatelyOnError: true

env:
  variables:
    PROJECT_ID: "${PROJECT_ID}"
    ARCHIVE_NAME: "${ARCHIVE_NAME}"
    PROJECT_LABEL: "${PROJECT_LABEL}"
    OS_OBJECT_NAME: "${OS_OBJECT_NAME}"
    OS_BUCKET: "${OS_BUCKET}"
    OS_NAMESPACE: "${OS_NAMESPACE}"
    SRC_TOKEN_URL: "${SRC_TOKEN_URL}"
    SRC_CLIENT_ID: "${SRC_CLIENT_ID}"
    SRC_CLIENT_SECRET: "${SRC_CLIENT_SECRET}"
    SRC_SCOPE: "${SRC_SCOPE}"
    SRC_OIC_BASE_URL: "${SRC_OIC_BASE_URL}"
    SRC_OIC_INSTANCE: "${SRC_OIC_INSTANCE}"
    TGT_TOKEN_URL: "${TGT_TOKEN_URL}"
    TGT_CLIENT_ID: "${TGT_CLIENT_ID}"
    TGT_CLIENT_SECRET: "${TGT_CLIENT_SECRET}"
    TGT_SCOPE: "${TGT_SCOPE}"
    TGT_OIC_BASE_URL: "${TGT_OIC_BASE_URL}"
    TGT_OIC_INSTANCE: "${TGT_OIC_INSTANCE}"
  exportedVariables:
    - OS_OBJECT_NAME
    - ARCHIVE_PATH

steps:
  - type: Command
    name: Setup
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR:-.}"
      echo "=== OIC Export + Import ==="
      if command -v jq >/dev/null 2>&1; then
        echo "jq: OK"
      elif command -v yum >/dev/null 2>&1; then
        yum install -y jq
      elif command -v apt-get >/dev/null 2>&1; then
        apt-get update -y && apt-get install -y jq
      fi
      command -v jq curl oci
      mkdir -p exports
      chmod +x scripts/*.sh
      export OCI_CLI_AUTH="${OCI_CLI_AUTH:-resource_principal}"
      export ARCHIVE_PATH="exports/${ARCHIVE_NAME}"
      export OS_OBJECT_NAME="${OS_OBJECT_NAME:-oic-exports/${ARCHIVE_NAME}}"
      for v in SRC_TOKEN_URL SRC_CLIENT_ID SRC_CLIENT_SECRET SRC_SCOPE SRC_OIC_BASE_URL SRC_OIC_INSTANCE \
               TGT_TOKEN_URL TGT_CLIENT_ID TGT_CLIENT_SECRET TGT_SCOPE TGT_OIC_BASE_URL TGT_OIC_INSTANCE \
               OS_BUCKET PROJECT_ID ARCHIVE_NAME; do
        eval "test -n \"\${${v}:-}\" || { echo \"Missing ${v}\"; exit 1; }"
      done
      echo "Project:  ${PROJECT_ID}"
      echo "Source:   ${SRC_OIC_INSTANCE}"
      echo "Target:   ${TGT_OIC_INSTANCE}"
      echo "Archive:  ${ARCHIVE_PATH}"
      echo "Bucket:   ${OS_BUCKET}"
      echo "Object:   ${OS_OBJECT_NAME}"

  - type: Command
    name: Export from source OIC
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR:-.}"
      export ARCHIVE_PATH="exports/${ARCHIVE_NAME}"
      SRC_TOKEN="$(scripts/get_token.sh "${SRC_TOKEN_URL}" "${SRC_CLIENT_ID}" "${SRC_CLIENT_SECRET}" "${SRC_SCOPE}")"
      scripts/export_project.sh \
        "${SRC_OIC_BASE_URL}" \
        "${SRC_OIC_INSTANCE}" \
        "${SRC_TOKEN}" \
        "${PROJECT_ID}" \
        "${PROJECT_LABEL:-}" \
        "${ARCHIVE_PATH}"
      test -f "${ARCHIVE_PATH}"
      ls -la "${ARCHIVE_PATH}"

  - type: Command
    name: Upload to Object Storage
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR:-.}"
      export OCI_CLI_AUTH="${OCI_CLI_AUTH:-resource_principal}"
      export ARCHIVE_PATH="exports/${ARCHIVE_NAME}"
      export OS_OBJECT_NAME="${OS_OBJECT_NAME:-oic-exports/${ARCHIVE_NAME}}"
      scripts/oss_object_put.sh "${ARCHIVE_PATH}" "${OS_BUCKET}" "${OS_OBJECT_NAME}"
      echo "Uploaded: ${OS_OBJECT_NAME}"

  - type: Command
    name: Download from Object Storage
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR:-.}"
      export OCI_CLI_AUTH="${OCI_CLI_AUTH:-resource_principal}"
      export ARCHIVE_PATH="exports/${ARCHIVE_NAME}"
      export OS_OBJECT_NAME="${OS_OBJECT_NAME:-oic-exports/${ARCHIVE_NAME}}"
      scripts/oss_object_get.sh "${OS_BUCKET}" "${OS_OBJECT_NAME}" "${ARCHIVE_PATH}"
      test -f "${ARCHIVE_PATH}"
      ls -la "${ARCHIVE_PATH}"

  - type: Command
    name: Import to target OIC
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR:-.}"
      export ARCHIVE_PATH="exports/${ARCHIVE_NAME}"
      TGT_TOKEN="$(scripts/get_token.sh "${TGT_TOKEN_URL}" "${TGT_CLIENT_ID}" "${TGT_CLIENT_SECRET}" "${TGT_SCOPE}")"
      scripts/import_project.sh \
        "${TGT_OIC_BASE_URL}" \
        "${TGT_OIC_INSTANCE}" \
        "${TGT_TOKEN}" \
        "${ARCHIVE_PATH}"
      echo "Export + import complete."
