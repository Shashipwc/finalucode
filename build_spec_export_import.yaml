version: 0.1
component: build
timeoutInSeconds: 7200
shell: bash
failImmediatelyOnError: true

env:
  variables:
    ARCHIVE_NAME: "project-export.car"
    OS_NAMESPACE: ""
    PROJECT_LABEL: ""
    OS_OBJECT_NAME: ""
  exportedVariables:
    - OS_OBJECT_NAME
    - ARCHIVE_PATH

steps:
  - type: Command
    name: Setup
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR:-.}"
      echo "=== OIC Export + Import ==="
      if ! command -v jq >/dev/null; then
        if command -v yum >/dev/null; then
          yum install -y jq
        elif command -v microdnf >/dev/null; then
          microdnf install -y jq
        elif command -v apt-get >/dev/null; then
          apt-get update -y && apt-get install -y jq
        else
          echo "ERROR: cannot install jq"
          exit 1
        fi
      fi
      command -v jq curl oci
      mkdir -p exports
      chmod +x scripts/*.sh
      export OCI_CLI_AUTH="${OCI_CLI_AUTH:-resource_principal}"
      export ARCHIVE_NAME="${ARCHIVE_NAME:-project-export.car}"
      export ARCHIVE_PATH="exports/${ARCHIVE_NAME}"
      export OS_OBJECT_NAME="${OS_OBJECT_NAME:-oic-exports/${ARCHIVE_NAME}}"

      check_param() {
        local n="$1" v="${!1:-}"
        if [ -z "${v}" ]; then
          echo "ERROR: '${n}' is empty — set Pipeline → Parameter '${n}'"
          exit 1
        fi
        case "${v}" in '${'*'}'|'$'"${n}"|*'${'"${n}"'}'*)
          echo "ERROR: '${n}' is a placeholder (${v})"
          exit 1
        ;; esac
      }
      for n in SRC_TOKEN_URL SRC_CLIENT_ID SRC_CLIENT_SECRET SRC_SCOPE SRC_OIC_BASE_URL SRC_OIC_INSTANCE \
               TGT_TOKEN_URL TGT_CLIENT_ID TGT_CLIENT_SECRET TGT_SCOPE TGT_OIC_BASE_URL TGT_OIC_INSTANCE \
               OS_BUCKET PROJECT_ID ARCHIVE_NAME; do
        check_param "${n}"
      done
      case "${SRC_TOKEN_URL}" in https://*) ;; *) echo "ERROR: SRC_TOKEN_URL must be https://"; exit 1 ;; esac
      case "${TGT_TOKEN_URL}" in https://*) ;; *) echo "ERROR: TGT_TOKEN_URL must be https://"; exit 1 ;; esac
      case "${SRC_CLIENT_ID}" in https://*) echo "ERROR: SRC_CLIENT_ID must be client id, not URL"; exit 1 ;; esac

      env_file="/tmp/oic-build.env"
      : > "${env_file}"
      for n in PROJECT_ID ARCHIVE_NAME PROJECT_LABEL OS_OBJECT_NAME OS_BUCKET OS_NAMESPACE \
               SRC_TOKEN_URL SRC_CLIENT_ID SRC_CLIENT_SECRET SRC_SCOPE SRC_OIC_BASE_URL SRC_OIC_INSTANCE \
               TGT_TOKEN_URL TGT_CLIENT_ID TGT_CLIENT_SECRET TGT_SCOPE TGT_OIC_BASE_URL TGT_OIC_INSTANCE \
               ARCHIVE_PATH OCI_CLI_AUTH; do
        printf '%s=%q\n' "${n}" "${!n}" >> "${env_file}"
      done
      chmod 600 "${env_file}"
      echo "SRC_TOKEN_URL host: $(echo "${SRC_TOKEN_URL}" | sed 's#https://##' | cut -d/ -f1)"
      echo "Project: ${PROJECT_ID} | Source: ${SRC_OIC_INSTANCE} | Target: ${TGT_OIC_INSTANCE}"

  - type: Command
    name: Export from source OIC
    command: |
      set -euo pipefail
      set -a && . /tmp/o
